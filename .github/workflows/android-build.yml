name: Android Build
on:
  push:
    branches: [New]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify JDK
        run: java -version
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Stop old Gradle daemons
        run: ./gradlew --stop
      - name: Decode private Vesta keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Actions secret: KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vesta-release.jks"
          test -s "$RUNNER_TEMP/vesta-release.jks"
      - name: Build release APK (R8, private Vesta signing)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/vesta-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing GitHub Actions secret: KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing GitHub Actions secret: KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing GitHub Actions secret: KEY_PASSWORD"; exit 1; }
          ./gradlew assembleRelease --stacktrace
      - name: Verify release APK identity and signing
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          RELEASE_APK="app/build/outputs/apk/release/Vesta-${GITHUB_RUN_NUMBER}-release.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$RELEASE_APK" | grep -E "^package:|^application-label:"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          echo "Release APK for update testing: $RELEASE_APK"
      - name: Build debug APK
        if: always()
        run: |
          ./gradlew assembleDebug --stacktrace
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Vesta-${GITHUB_RUN_NUMBER}-debug.apk"
          fi
      - name: Upload release APK (install/update this version)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VESTA-${{ github.run_number }}-RELEASE-UPDATE
          path: app/build/outputs/apk/release/Vesta-${{ github.run_number }}-release.apk
          if-no-files-found: error
      - name: Upload debug APK (development only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VESTA-${{ github.run_number }}-DEBUG-ONLY
          path: app/build/outputs/apk/debug/Vesta-${{ github.run_number }}-debug.apk
          if-no-files-found: warn
